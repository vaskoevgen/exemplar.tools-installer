version: "1.0"
generated_by: constrain
session_id: docs_website_001
system: exemplar.tools Documentation Website

trust:
  floor: 0.10
  authority_override_floor: 0.40
  decay_lambda: 0.05
  taint_lock_tiers: []
  conflict_trust_delta_threshold: 0.20

classifications:
  - field_pattern: "comment.*"
    tier: PUBLIC
    authoritative_component: convex_backend
    canary_eligible: true
    canary_pattern: "comment_*"
    rationale: "User-generated comments are public community content"
  
  - field_pattern: "tool_content.*"
    tier: PUBLIC
    authoritative_component: null
    canary_eligible: false
    canary_pattern: null
    rationale: "Tool documentation sourced from canonical README files"
  
  - field_pattern: "page_identifier"
    tier: PUBLIC
    authoritative_component: frontend
    canary_eligible: true
    canary_pattern: "page_*"
    rationale: "Page routing and identification data"

soak:
  base_durations:
    PUBLIC: 1h
  target_requests: 1000

authority_map:
  - component: convex_backend
    domains: ["comment.*", "realtime.*"]
    rationale: "Owns comment persistence and real-time distribution"
  
  - component: frontend
    domains: ["page.*", "navigation.*", "ui.*"]
    rationale: "Owns presentation layer and user interaction"

human_gates:
  always: []
  on_low_trust_authoritative: false
  on_unresolvable_conflict: true