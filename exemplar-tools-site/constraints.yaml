- id: C001
  boundary: Development Server Configuration
  condition: Development server must run exclusively on port 4000
  violation: Server starts on different port or fails to bind to 4000
  severity: must
  rationale: Ensures consistent development environment and avoids conflicts with other exemplar.tools
  classification_tier: null
  affected_components: [frontend]

- id: C002
  boundary: Package Manager Usage
  condition: Only Bun package manager may be used, never npm or yarn
  violation: npm or yarn commands executed or lockfiles created
  severity: must
  rationale: Maintains consistency with exemplar.tools ecosystem tooling choices
  classification_tier: null
  affected_components: [frontend]

- id: C003
  boundary: Page Structure
  condition: Exactly 12 pages must exist (home + 11 tools in workflow order)
  violation: Missing pages or extra pages beyond the defined set
  severity: must
  rationale: Complete coverage of exemplar.tools workflow without scope creep
  classification_tier: null
  affected_components: [frontend]

- id: C004
  boundary: Content Source Authority
  condition: All tool content must derive exclusively from README files and howto.md
  violation: Tool descriptions or instructions sourced from other materials
  severity: must
  rationale: Ensures accuracy and prevents documentation drift from canonical sources
  classification_tier: PUBLIC
  affected_components: [frontend]

- id: C005
  boundary: Comment Data Model
  condition: Comments limited to page identifier, author name, body text, and timestamp fields only
  violation: Additional user data, metadata, or complex comment structures
  severity: must
  rationale: Keeps system simple and avoids PII collection concerns
  classification_tier: PUBLIC
  affected_components: [convex_backend, frontend]

- id: C006
  boundary: Real-time Comment Functionality
  condition: Comments must appear live on all connected clients without page refresh
  violation: Comments require manual refresh or fail to sync across sessions
  severity: must
  rationale: Core value proposition for community learning and engagement
  classification_tier: PUBLIC
  affected_components: [convex_backend, frontend]

- id: C007
  boundary: Video Embedding
  condition: YouTube videos must embed using URLs specified in howto.md only
  violation: Videos from other sources or hardcoded YouTube URLs
  severity: must
  rationale: Maintains content authority and prevents unauthorized media inclusion
  classification_tier: PUBLIC
  affected_components: [frontend]

- id: C008
  boundary: Version Badge Display
  condition: Tool version badges must reflect current versions from respective README files
  violation: Hardcoded versions or versions from other sources
  severity: should
  rationale: Helps developers ensure tool compatibility in their workflows
  classification_tier: PUBLIC
  affected_components: [frontend]

- id: C009
  boundary: Visual Design Consistency
  condition: Dark industrial terminal aesthetic with near-black background and electric cyan accent
  violation: Light themes, different color schemes, or non-terminal styling
  severity: should
  rationale: Brand consistency with exemplar.tools identity and user expectations
  classification_tier: null
  affected_components: [frontend]

- id: C010
  boundary: Typography Requirements
  condition: Instrument Serif for headings, JetBrains Mono for code blocks
  violation: Different font families or fallback fonts in production
  severity: should
  rationale: Professional presentation matching exemplar.tools documentation standards
  classification_tier: null
  affected_components: [frontend]