    domains: ["ui.*", "user_interaction.*"]
    rationale: "Owns user interface and interaction domain"
  - component: "api_backend"
    domains: ["tasks.*", "business_logic.*"]
    rationale: "Owns task business logic and data operations"
  - component: "database"
    domains: ["persistence.*", "storage.*"]
    rationale: "Owns data persistence and storage domain"

human_gates:
  always: []
  on_low_trust_authoritative: false
  on_unresolvable_conflict: true