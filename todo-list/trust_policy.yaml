system: "Task Management Web Application"

trust:
  floor: 0.10
  authority_override_floor: 0.40
  decay_lambda: 0.05
  taint_lock_tiers: []
  conflict_trust_delta_threshold: 0.20

classifications:
  - field_pattern: "tasks.*"
    tier: PUBLIC
    authoritative_component: "api_backend"
    canary_eligible: true
    canary_pattern: "tasks.title"
    rationale: "Personal task data with no sensitive information"

