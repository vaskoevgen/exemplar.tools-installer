name: links
version: 1

fields:
  - name: id
    field_type: serial
    classification: PUBLIC
    nullable: false
    annotations:
      - name: primary_key

  - name: short_code
    field_type: varchar(6)
    classification: PUBLIC
    nullable: false
    annotations:
      - name: immutable
      - name: not_null

  - name: original_url
    field_type: text
    classification: PUBLIC
    nullable: false
    annotations:
      - name: immutable
      - name: not_null

  - name: created_at
    field_type: timestamptz
    classification: PUBLIC
    nullable: false
    annotations:
      - name: immutable
      - name: not_null
