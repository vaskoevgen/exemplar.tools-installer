# exemplar.tools — Repository Configuration
#
# FORMAT (space or tab separated):
#   <git_url>  <branch_or_tag>  [local_dir]
#
# Fields:
#   git_url      — full HTTPS or SSH clone URL
#   branch_or_tag — branch name (e.g. main) or git tag (e.g. v1.2.0)
#   local_dir    — optional; defaults to $EXEMPLAR_INSTALL_DIR/<repo-name>
#                  supports ~ expansion
#
# Lines starting with # are comments. Blank lines are ignored.
#
# Override defaults at runtime:
#   EXEMPLAR_INSTALL_DIR=~/my-tools  — base dir when local_dir is omitted
#   EXEMPLAR_CONFIG_URL=<url>        — use a different config file
#
# ─────────────────────────────────────────────────────────────────
# Example entries (uncomment and edit as needed):
# ─────────────────────────────────────────────────────────────────

# Clone latest stable branch
# https://github.com/vaskoevgen/example-tool     main

# Pin to a specific release tag
# https://github.com/vaskoevgen/example-tool     v1.2.0

# With explicit local destination
# https://github.com/vaskoevgen/example-tool     main     ~/tools/example-tool

