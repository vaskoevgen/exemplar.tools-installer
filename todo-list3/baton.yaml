# Baton topology config -- generated by pact deploy
# Canary thresholds: error_rate < 5.0%, p95 < 500.0ms
#
# To use: pip install baton-orchestrator && baton up
# See: https://github.com/jmcentire/baton

name: root
version: 1
nodes:
- name: database
  port: 3000
  metadata:
    description: PostgreSQL database initialization on port 5432. Provides a single
      idempotent SQL init script (init.
- name: backend
  port: 3001
  role: ingress
  metadata:
    description: A FastAPI application running on port 8000 that implements the task
      management REST API. Connects to
    health_check: http://127.0.0.1:3001/health
    canary_error_rate_pct: '5.0'
    canary_p95_ms: '500.0'
- name: frontend
  port: 3002
  metadata:
    description: A React + Vite + TypeScript single-page application running on port
      5173 that provides the task mana
    health_check: http://127.0.0.1:3002/health
    canary_error_rate_pct: '5.0'
    canary_p95_ms: '500.0'
edges:
- source: backend
  target: database
- source: frontend
  target: backend
observability:
  enabled: true
  sink: jsonl
deploy:
  provider: local
