# Apprentice Configuration
# Generated by: apprentice init

provider:
  api_base_url: https://api.anthropic.com
  api_key: "env:ANTHROPIC_API_KEY"
  model: "claude-haiku-4-5-20251001"
  timeout_seconds: 30
  max_retries: 3
  retry_base_delay_seconds: 1.0

local_model:
  endpoint: "http://localhost:11434"
  model_name: "llama3.1:8b"
  timeout_seconds: 60
  max_retries: 1
  health_check_path: /health

tasks:
  - task_name: calculator_eval
    prompt_template: |
      Given an arithmetic expression, return the numeric result.
      Input: {expression}
    input_schema:
    - name: expression
      type: string
      required: true
    output_schema:
    - name: result
      type: string
      required: true
    evaluators:
      - type: exact_match
        match_fields:
        - name: result
          weight: 1.0
          case_sensitive: true
    thresholds:
      local_ready: 0.7
      local_only: 0.85
      degraded_threshold: 0.3
    sampling_rate_initial: 1.0
    min_training_examples: 100

budget:
  max_daily_cost_usd: 10.00
  max_monthly_cost_usd: 150.00
  rolling_window_hours: 24
  cost_per_input_token: 0.000003
  cost_per_output_token: 0.000015
  budget_state_path: .apprentice/budget_state.json

finetuning:
  backend: local_lora
  model_base: "llama3.1:8b"
  batch_size: 100
  trigger_interval_hours: 24
  output_dir: .apprentice/models/
  max_concurrent_jobs: 1

audit:
  log_path: .apprentice/audit.log
  log_level: INFO
  log_to_stdout: false
  max_file_size_mb: 100
  backup_count: 5

training_data:
  storage_dir: .apprentice/training_data/
  max_examples_per_task: 50000
