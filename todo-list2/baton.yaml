# Baton topology config -- generated by pact deploy
# Canary thresholds: error_rate < 5.0%, p95 < 500.0ms
#
# To use: pip install baton-orchestrator && baton up
# See: https://github.com/jmcentire/baton

name: root
version: 1
nodes:
- name: root
  port: 3001
  role: ingress
  metadata:
    description: Root interface contract for a personal task management web app. Defines
      canonical types (frozen data
    health_check: http://127.0.0.1:3001/tasks
    canary_error_rate_pct: '5.0'
    canary_p95_ms: '500.0'
observability:
  enabled: true
  sink: jsonl
deploy:
  provider: local
